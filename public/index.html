<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111d2b">
<title>KAMRADS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111d2b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%233ddc97' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233ddc97'/%3E%3C/svg%3E">
<style>
:root {
  --navy: #111d2b; --navy-2: #182739; --navy-3: #22344a; --line: #2b3f57;
  --ink: #e8eef5; --muted: #8fa3b8; --green: #3ddc97; --green-dim: rgba(61,220,151,.14);
  --amber: #f5b642; --red: #ff5d5d; --red-dim: rgba(255,93,93,.14); --blue: #6cb4ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0c1520; color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
a { color: inherit; }
header { background: var(--navy); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand b { font-size: 20px; letter-spacing: .5px; }
.brand small { display: block; color: var(--green); font-weight: 600; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: -2px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--navy-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--green); } .dot.warn { background: var(--amber); } .dot.bad { background: var(--red); }
.controls { max-width: 1240px; margin: 0 auto; padding: 10px 16px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--navy-2); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--green-dim); border-color: var(--green); color: var(--green); }
input[type=search], select { background: var(--navy-2); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
input[type=search] { flex: 1 1 180px; min-width: 140px; }
main { max-width: 1240px; margin: 0 auto; padding: 12px 16px 60px; }
dialog#settings { background: var(--navy); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; width: min(520px, calc(100vw - 32px)); }
dialog#settings::backdrop { background: rgba(0,0,0,.55); }
#settings h2 { margin: 0 0 4px; font-size: 18px; }
#settings label { display: block; margin: 14px 0 0; font-size: 13.5px; }
#settings input[type=password], #settings input[type=url], #settings input[type=number] { display: block; width: 100%; margin-top: 6px; background: var(--navy-2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; }
#settings .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
#settings .row.end { justify-content: flex-end; margin-top: 18px; }
#settings .save { background: var(--green); color: #06281a; border: 0; border-radius: 8px; padding: 7px 16px; font: inherit; font-weight: 700; cursor: pointer; }
.research { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.research summary { cursor: pointer; color: var(--ink); }
.research ul { margin: 6px 0 4px; padding-left: 18px; }
.research a { color: var(--blue); }
.research.err { color: var(--amber); }
.capture { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12.5px; }
.capture b { color: var(--ink); }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--navy); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.stat .n { font-size: 22px; font-weight: 700; } .stat .l { color: var(--muted); font-size: 12px; }
.stat.hot .n { color: var(--green); }
.lot { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: center; background: var(--navy); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.lot.deal { border-left-color: var(--green); background: linear-gradient(90deg, rgba(61,220,151,.07), var(--navy) 40%); }
.lot.alerted { border-left-color: var(--red); }
.clock { text-align: center; font-variant-numeric: tabular-nums; }
.clock .t { font-size: 17px; font-weight: 700; }
.clock .d { color: var(--muted); font-size: 11px; }
.clock.soon .t { color: var(--amber); } .clock.now .t { color: var(--red); }
.title { font-weight: 600; font-size: 15px; text-decoration: none; }
.title:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--navy-3); color: var(--ink); }
.tag.stat { background: var(--red-dim); color: var(--red); border: 0; }
.tag.rep { background: rgba(245,182,66,.14); color: var(--amber); }
.tag.ok { background: var(--green-dim); color: var(--green); }
.tag.site { background: transparent; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-size: 10.5px; }
.price { text-align: right; min-width: 170px; }
.price .bid { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price .sub { color: var(--muted); font-size: 12px; }
.price .est { font-size: 12.5px; margin-top: 2px; }
.price .est.good { color: var(--green); font-weight: 600; }
.acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
.icon { background: var(--navy-2); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px; }
.icon.on { color: var(--amber); border-color: var(--amber); }
.empty { color: var(--muted); text-align: center; padding: 60px 20px; border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--ink); }
.watch { background: var(--navy); border: 1px solid var(--line); border-top: 3px solid var(--amber); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.watch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.watch-head h2 { margin: 0; font-size: 16px; }
.watch-head .hint { color: var(--muted); font-size: 12px; }
.watch-add { margin-left: auto; display: flex; gap: 6px; flex: 1 1 320px; max-width: 520px; }
.watch-add input { flex: 1; background: var(--navy-2); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; min-width: 0; }
.watch-add button { background: var(--amber); color: #1a1300; border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.wrow { display: grid; grid-template-columns: 86px 1fr auto auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.wrow .wt { font-weight: 600; text-decoration: none; }
.wrow .wm { color: var(--muted); font-size: 12px; margin-top: 2px; }
.wrow .wp { text-align: right; font-variant-numeric: tabular-nums; }
.wrow .wp b { font-size: 18px; }
.wrow .up { color: var(--red); font-size: 12px; font-weight: 600; }
.wrow.sold { opacity: .75; }
.watch-empty { color: var(--muted); font-size: 13px; padding: 6px 0 2px; }
@media (max-width: 720px) { .wrow { grid-template-columns: 64px 1fr auto; } .wrow .wx { display: none; } .watch-add { max-width: none; } }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
@media (max-width: 720px) {
  .summary { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .lot { grid-template-columns: 64px 1fr; }
  .price { grid-column: 1 / -1; text-align: left; display: flex; justify-content: space-between; align-items: end; min-width: 0; border-top: 1px solid var(--line); padding-top: 8px; }
  .acts { margin: 0; }
  .status { margin-left: 0; width: 100%; }
  header { position: static; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="13" fill="none" stroke="#3ddc97" stroke-width="2.6" stroke-dasharray="62 20" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="7.5" fill="none" stroke="#3ddc97" stroke-width="2.6" stroke-dasharray="34 13" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="2.6" fill="#3ddc97"/>
        <line x1="17" y1="17" x2="27" y2="7" stroke="#3ddc97" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span><b>KAMRADS</b><small>Auction Intelligence</small></span>
    </a>
    <div class="status" id="status"></div>
  </div>
  <div class="controls" id="filters">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="deals" aria-pressed="false">Deals</button>
    <button class="chip" data-f="vehicles" aria-pressed="false">Vehicles</button>
    <button class="chip" data-f="under500" aria-pressed="false">Under $500</button>
    <button class="chip" data-f="sold" aria-pressed="false">Sold</button>
    <button class="chip" id="hideStat" aria-pressed="true">Hide statutory</button>
    <select id="site"><option value="">All sites</option><option value="pickles">Pickles</option><option value="manheim">Manheim</option><option value="allbids">ALLBIDS</option></select>
    <select id="sort"><option value="hot">Hottest deals first</option><option value="ending">Ends soonest</option><option value="price">Lowest price</option><option value="profit">Biggest est. profit</option></select>
    <select id="hours"><option value="3">Next 3 h</option><option value="24">Next 24 h</option><option value="48" selected>Next 48 h</option><option value="168">Next 7 days</option></select>
    <input type="search" id="q" placeholder="Search: hilux, tipper, Perth…">
  </div>
</header>
<main>
  <section class="watch" id="watch">
    <div class="watch-head">
      <h2>★ My watchlist</h2><span class="hint" id="watchHint">re-checked every 60 s</span>
      <form class="watch-add" id="watchAdd"><input id="watchUrl" type="url" placeholder="Paste a Pickles / ALLBIDS / Manheim lot link to watch it"><button>Watch</button></form>
    </div>
    <div id="watchList"></div>
  </section>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</main>
<footer>Spot it. Track it. Win it. · <a href="#" id="openSettings">Settings</a> · <a href="#" id="testAlert">Send a test alert</a> · <span id="updated"></span></footer>
<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <p class="sub">Saved on this KAMRADS server only — never in GitHub. The key is never shown in full again.</p>
    <label>Claude API key <span class="sub" id="keyState"></span>
      <input id="sKey" type="password" autocomplete="off" placeholder="sk-ant-… (leave blank to keep the saved key)"></label>
    <div class="row"><button type="button" class="icon" id="testKey">Test key</button><button type="button" class="icon" id="clearKey">Remove key</button><span class="sub" id="keyResult"></span></div>
    <label><input id="sResearch" type="checkbox"> Research prices automatically (watchlist, vehicles, and lots over $50 closing within 6 h)</label>
    <label>Daily limit on automatic lookups <span class="sub">(each about 5–10c)</span>
      <input id="sPerDay" type="number" min="0" max="1000" step="10"></label>
    <label>Phone alert link (ntfy) <input id="sNtfy" type="url" placeholder="https://ntfy.sh/kamrads-your-secret-topic"></label>
    <div class="row end"><button type="button" class="icon" id="closeSettings">Cancel</button><button class="save" id="saveSettings">Save</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : '$' + Math.round(n).toLocaleString('en-AU');
const SLEEPER = 0.25;
let aiOn = false, soldStats = [], watch = [], lastBid = {}, curBid = {}, lots = [], filter = 'all', clockSkew = 0, mode = 'live';
const pref = (k, d) => { try { return JSON.parse(localStorage.getItem('k_' + k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('k_' + k, JSON.stringify(v)); } catch {} };
filter = pref('filter', 'all'); if (filter === 'starred') filter = 'all';
$('#hideStat').setAttribute('aria-pressed', String(pref('hideStat', true)));
$('#site').value = pref('site', '');
$('#sort').value = pref('sort', 'hot');
$('#hours').value = String(pref('hours', 48));

function left(ms) {
  if (ms <= 0) return 'closing';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
  return `${m}:${String(sec).padStart(2, '0')}`;
}
const fmtClose = t => new Date(t).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Perth' }) + ' AWST';
const CHEAP_VEHICLE = 3000;
// Deal strength from the CURRENT price: lower = better. As bidding climbs the number rises and the lot sinks.
function strength(l) {
  const p = l.bid ?? l.startPrice;
  if (p == null) return null;
  if (l.estimate) return p / l.estimate;
  if (l.vehicle) return (p / CHEAP_VEHICLE) * SLEEPER;   // no estimate: a $3,000 vehicle scores the same as 25% of value
  if (p <= 5) return 0;                                   // penny lot
  return null;
}
const isDeal = l => { const s = strength(l); return s != null && s <= SLEEPER; };
const priceOf = l => (mode === 'sold' ? l.finalBid : l.bid ?? l.startPrice);
const SORTS = {
  ending: (a, b) => (a.endAt ?? Infinity) - (b.endAt ?? Infinity),
  price: (a, b) => (priceOf(a) ?? Infinity) - (priceOf(b) ?? Infinity) || SORTS.ending(a, b),
  profit: (a, b) => (b.profit ?? -Infinity) - (a.profit ?? -Infinity) || SORTS.ending(a, b),
  hot: (a, b) => {
    const da = isDeal(a), db = isDeal(b);
    if (da !== db) return da ? -1 : 1;
    if (da) return strength(a) - strength(b) || SORTS.ending(a, b);
    return SORTS.ending(a, b);
  },
};

function wovrTag(w) {
  if (!w) return '';
  const cls = /statutory/i.test(w) ? 'stat' : /inspection/i.test(w) ? 'ok' : /repairable/i.test(w) ? 'rep' : '';
  const label = /statutory/i.test(w) ? 'Statutory W/O · parts only' : w;
  return `<span class="tag ${cls}">${esc(label)}</span>`;
}

function visible() {
  const q = $('#q').value.trim().toLowerCase();
  const site = $('#site').value, hideStat = $('#hideStat').getAttribute('aria-pressed') === 'true';
  return lots.filter(l => {
    if (site && l.site !== site) return false;
    if (hideStat && /statutory/i.test(l.wovr || '') && !l.starred) return false;
    if (q && !`${l.title} ${l.location} ${l.state} ${l.sale} ${l.category}`.toLowerCase().includes(q)) return false;
    const p = l.bid ?? l.startPrice;
    if (filter === 'sold') return true;
    if (l.starred) return false; // shown in the watchlist panel instead
    if (filter === 'deals') return isDeal(l);
    if (filter === 'vehicles') return l.vehicle;
    if (filter === 'under500') return p != null && p <= 500;
    if (filter === 'starred') return l.starred;
    return true;
  });
}

function ago(t) {
  if (!t) return 'not checked yet';
  const s = Math.max(0, Math.round((Date.now() + clockSkew - t) / 1000));
  return s < 90 ? `checked ${s}s ago` : `checked ${Math.round(s / 60)} min ago`;
}

const slugName = u => { const w = String(u || '').split(/[?#]/)[0].replace(/\/$/, '').split('/').pop().replace(/-?\d{5,}$/, '').split('-').filter(Boolean); return w.length > 1 ? w.map(x => x[0].toUpperCase() + x.slice(1)).join(' ') : ''; };

function compsBlock(l) {
  if (l.estMethod === 'error') return `<div class="research err">Research failed: ${esc((l.estNote || '').replace(/^error: /, ''))}</div>`;
  if (l.estMethod !== 'web') return '';
  const pct = l.marketAvg && (l.bid ?? l.startPrice) != null ? Math.round(((l.bid ?? l.startPrice) / l.marketAvg) * 100) : null;
  const flag = pct != null && pct <= 50 ? `<span class="tag ok">${pct}% of market — great price</span>` : pct != null && pct <= 75 ? `<span class="tag rep">${pct}% of market</span>` : '';
  return `<details class="research"><summary>Market ${l.marketAvg ? '~' + money(l.marketAvg) : 'n/a'} · resale ${money(l.estLow)}–${money(l.estHigh).slice(1)} · ${l.comps.length} comparable${l.comps.length === 1 ? '' : 's'} ${flag}</summary>
    <ul>${l.comps.map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title || c.url)}</a>${c.price ? ` — ${money(c.price)}` : ''}${c.km ? ` · ${Number(c.km).toLocaleString('en-AU')} km` : ''}</li>`).join('')}</ul>
    <div class="sub">${esc(l.estNote || '')}</div></details>`;
}

function renderWatch() {
  const now = Date.now() + clockSkew;
  $('#watchList').innerHTML = !watch.length
    ? '<div class="watch-empty">Nothing yet. Tap ★ on any lot below, or paste a lot link above, and it lives here with its price checked every minute.</div>'
    : watch.map(l => {
      const closed = l.status === 'closed';
      const ms = l.endAt ? l.endAt - now : null;
      const cls = closed || ms == null ? '' : ms < 600000 ? 'now' : ms < 3600000 ? 'soon' : '';
      const price = closed ? (l.finalBid ?? l.bid) : (l.bid ?? l.startPrice);
      const moved = !closed && lastBid[l.key] != null && l.bid != null && l.bid > lastBid[l.key];
      return `<div class="wrow ${closed ? 'sold' : ''}">
        <div class="clock ${cls}">${closed ? '<div class="t">SOLD</div>' : `<div class="t" data-end="${l.endAt ?? ''}">${ms == null ? '…' : left(ms)}</div>`}<div class="d">${l.endAt ? esc(fmtClose(l.endAt)) : 'reading lot…'}</div></div>
        <div><a class="wt" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || slugName(l.url) || 'Loading lot details…')}</a>
          <div class="wm"><span class="tag site">${esc(l.site)}</span> ${esc([l.location, l.state].filter(Boolean).join(' '))}${l.odometer ? ' · ' + l.odometer.toLocaleString('en-AU') + ' km' : ''}${l.wovr ? ' · ' + esc(l.wovr) : ''} · ${closed ? (l.seenMinsBeforeClose != null && l.seenMinsBeforeClose <= 1 ? 'hammer price' : 'final price seen') : ago(l.lastChecked)}</div>${compsBlock(l)}</div>
        <div class="wp"><b>${money(price)}</b><div class="sub">${closed ? 'sold' : l.bidCount != null ? l.bidCount + (l.bidCount === 1 ? ' bid' : ' bids') : l.bid == null ? 'no bid seen' : 'current bid'}</div>${moved ? `<div class="up">▲ was ${money(lastBid[l.key])}</div>` : ''}${l.estimate ? `<div class="sub">est ${money(l.estimate)}</div>` : ''}</div>
        <div class="wx"><button class="icon on" data-unwatch="${esc(l.key)}" title="Stop watching">★</button>${closed ? '' : ` <button class="icon" data-research="${esc(l.key)}" title="Search the market for comparable prices">${l.estMethod === 'web' ? 'Re-check' : 'Research'}</button>`}</div>
      </div>`;
    }).join('');
  $('#watchHint').textContent = `${watch.filter(l => l.status === 'open').length} watching · re-checked every ${watchEvery} s`;
}
let watchEvery = 60;

function render() {
  renderWatch();
  const now = Date.now() + clockSkew;
  const sortBy = $('#sort').value;
  const rows = visible().sort(mode === 'sold' && (sortBy === 'ending' || sortBy === 'hot') ? (a, b) => (b.endAt ?? 0) - (a.endAt ?? 0) : SORTS[sortBy] || SORTS.hot);
  if (mode === 'sold') {
    const shown = visible();
    const priced = shown.filter(l => l.finalBid != null);
    const bargains = shown.filter(l => l.ratio != null && l.ratio <= 0.5);
    const under500 = shown.filter(l => l.finalBid != null && l.finalBid <= 500);
    const exact = shown.filter(l => l.seenMinsBeforeClose != null && l.seenMinsBeforeClose <= 1);
    $('#summary').innerHTML = `
      <div class="stat hot"><div class="n">${bargains.length}</div><div class="l">Sold under half the estimate</div></div>
      <div class="stat"><div class="n">${under500.length}</div><div class="l">Sold for $500 or less</div></div>
      <div class="stat"><div class="n">${priced.length.toLocaleString('en-AU')} / ${shown.length.toLocaleString('en-AU')}</div><div class="l">Closed lots with a final price${shown.length < lots.length ? ` (${lots.length - shown.length} hidden by filters)` : ''}</div></div>
      <div class="stat"><div class="n">${exact.length}</div><div class="l">Read in the final minute</div></div>
      <div class="capture">${soldStats.map(x => `<span><b>${({ pickles: 'Pickles', manheim: 'Manheim', allbids: 'ALLBIDS' })[x.site] || x.site}</b> ${x.closed} closed · ${x.priced} priced · ${x.hammer} at the hammer</span>`).join('') || '<span>No lots have closed yet in this period.</span>'}</div>`;
  }
  const hour = lots.filter(l => l.endAt && l.endAt - now < 3600000);
  const deals = lots.filter(isDeal);
  if (mode !== 'sold') $('#summary').innerHTML = `
    <div class="stat hot"><div class="n">${deals.length}</div><div class="l">Deals flagged</div></div>
    <div class="stat"><div class="n">${hour.length}</div><div class="l">Closing in the next hour</div></div>
    <div class="stat"><div class="n">${lots.length.toLocaleString('en-AU')}</div><div class="l">Lots tracked</div></div>
    <div class="stat"><div class="n">${lots.filter(l => l.starred).length}</div><div class="l">Starred</div></div>`;
  if (!rows.length) {
    const hiddenStat = lots.filter(l => /statutory/i.test(l.wovr || '')).length;
    const hideOn = $('#hideStat').getAttribute('aria-pressed') === 'true';
    $('#list').innerHTML = `<div class="empty">${lots.length ? (hideOn && hiddenStat ? `${hiddenStat} result${hiddenStat === 1 ? ' is a statutory write-off' : 's are statutory write-offs'}, hidden by <b>Hide statutory</b>. <a href="#" id="showStat">Show them</a>` : 'Nothing matches these filters.') : '<b>Scanning the auction sites…</b><br>The first full pass takes a few minutes. This page refreshes on its own.'}</div>`;
    return;
  }
  $('#list').innerHTML = rows.slice(0, 400).map(l => {
    const ms = l.endAt ? l.endAt - now : null;
    const cls = mode === 'sold' || ms == null ? '' : ms < 600000 ? 'now' : ms < 3600000 ? 'soon' : '';
    const p = l.bid ?? l.startPrice;
    const pct = l.ratio != null ? Math.round(l.ratio * 100) : null;
    const est = l.estimate != null
      ? `<div class="est ${l.ratio != null && l.ratio <= SLEEPER ? 'good' : ''}">est ${money(l.manualEstimate ?? l.estLow)}${l.manualEstimate == null && l.estHigh ? '–' + money(l.estHigh).slice(1) : ''}${pct != null ? ` · ${pct}%` : ''}${l.profit != null && l.profit > 0 ? ` · +${money(l.profit)}` : ''}</div>`
      : `<div class="est sub">no estimate</div>`;
    const dealCls = mode === 'sold' ? (l.ratio != null && l.ratio <= 0.5 ? 'deal' : '') : (isDeal(l) ? 'deal' : '');
    return `<div class="lot ${dealCls} ${l.alerts.length ? 'alerted' : ''}">
      <div class="clock ${cls}">${mode === 'sold' ? `<div class="t">SOLD</div>` : `<div class="t" data-end="${l.endAt ?? ''}">${ms == null ? '—' : left(ms)}</div>`}<div class="d">${l.endAt ? esc(fmtClose(l.endAt)) : esc(l.buyMethod || 'time TBA')}</div></div>
      <div>
        <a class="title" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || slugName(l.url) || 'Untitled lot')}</a>
        <div class="meta">
          <span class="tag site">${esc(l.site)}</span>
          ${l.location || l.state ? `<span>${esc([l.location, l.location?.includes(l.state) ? '' : l.state].filter(Boolean).join(' '))}</span>` : ''}
          ${l.odometer ? `<span>${l.odometer.toLocaleString('en-AU')} km</span>` : ''}
          ${wovrTag(l.wovr)}
          ${l.sale ? `<span>${esc(l.sale)}</span>` : ''}
          ${l.alerts.length ? `<span class="tag stat">ALERT · ${esc(l.alerts.join(', '))}</span>` : ''}
        </div>
        ${compsBlock(l)}
      </div>
      <div class="price">
        <div><div class="bid">${money(p)}</div><div class="sub">${mode === 'sold' ? (l.finalBid == null ? 'price not captured' : l.seenMinsBeforeClose == null ? 'price from listing' : l.seenMinsBeforeClose <= 1 ? 'hammer price' : `last seen ${l.seenMinsBeforeClose} min before close`) : l.bid == null && l.startPrice != null ? 'start price' : l.bidCount != null ? l.bidCount + (l.bidCount === 1 ? ' bid' : ' bids') : l.bid == null ? 'bid not visible yet' : 'current bid'}</div>${est}</div>
        <div class="acts">
          <button class="icon ${l.starred ? 'on' : ''}" data-star="${esc(l.key)}" title="Star: alert me in the final minutes">★</button>
          <button class="icon" data-est="${esc(l.key)}" title="Set your own resale estimate">Est</button>
          ${mode === 'sold' ? '' : `<button class="icon" data-research="${esc(l.key)}" title="Search the market for comparable prices">${l.estMethod === 'web' ? 'Re-check' : 'Research'}</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

function tick() {
  const now = Date.now() + clockSkew;
  document.querySelectorAll('.clock .t[data-end]').forEach(el => {
    const end = Number(el.dataset.end); if (!end) return;
    const ms = end - now;
    el.textContent = left(ms);
    el.parentElement.className = 'clock ' + (ms < 600000 ? 'now' : ms < 3600000 ? 'soon' : '');
  });
}

async function load() {
  try {
    const sold = filter === 'sold';
    const wl = fetch('/api/watchlist').then(x => x.json()).then(w => {
      // remember the previous price so a rise shows as "▲ was $X" until the next change
      for (const l of w.lots) {
        if (curBid[l.key] !== undefined && l.bid != null && l.bid !== curBid[l.key]) lastBid[l.key] = curBid[l.key];
        if (l.bid != null) curBid[l.key] = l.bid;
      }
      watch = w.lots; watchEvery = w.every;
    }).catch(() => {});
    const [r, s] = await Promise.all([fetch(sold ? '/api/closed?hours=' + Math.max(24, Number($('#hours').value)) : '/api/lots?hours=' + $('#hours').value), fetch('/api/status')]);
    const data = await r.json(), st = await s.json();
    aiOn = !!st.ai;
    clockSkew = data.now - Date.now();
    lots = data.lots;
    soldStats = data.stats || [];
    mode = sold ? 'sold' : 'live';
    await wl;
    $('#status').innerHTML = ['pickles', 'manheim', 'allbids'].map(site => {
      const x = st.sites.find(z => z.site === site) || {};
      const age = x.last_ok ? (Date.now() - x.last_ok) / 60000 : Infinity;
      const err = x.last_error_at && (!x.last_ok || x.last_error_at > x.last_ok);
      const cls = err ? 'bad' : age < 30 ? 'ok' : 'warn';
      const tip = err ? x.last_error : x.last_ok ? `last scan ${Math.round(age)} min ago` : 'waiting for first scan';
      return `<span class="pill" title="${esc(tip)}"><span class="dot ${cls}"></span>${({ pickles: 'Pickles', manheim: 'Manheim', allbids: 'ALLBIDS' })[site]}${x.last_count != null ? ' · ' + x.last_count : ''}${x.logged_in ? ' · logged in' : ''}</span>`;
    }).join('') + `<span class="pill"><span class="dot ${st.push ? 'ok' : 'warn'}"></span>Alerts ${st.push ? 'on' : 'not set up'}</span>`;
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    render();
  } catch (e) { $('#updated').textContent = 'Connection problem — retrying'; }
}

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'hideStat') { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(v)); save('hideStat', v); return render(); }
  const was = filter;
  filter = b.dataset.f; save('filter', filter);
  if ((was === 'sold') !== (filter === 'sold')) { lots = []; load(); }
  document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === filter)));
$('#q').addEventListener('input', render);
$('#site').addEventListener('change', e => { save('site', e.target.value); render(); });
$('#sort').addEventListener('change', e => { save('sort', e.target.value); render(); });
$('#hours').addEventListener('change', e => { save('hours', Number(e.target.value)); load(); });
$('#list').addEventListener('click', async e => {
  const star = e.target.closest('[data-star]'), estB = e.target.closest('[data-est]');
  if (star) {
    const l = lots.find(x => x.key === star.dataset.star); l.starred = !l.starred;
    await fetch(`/api/lots/${encodeURIComponent(l.key)}/star`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ starred: l.starred }) });
    load();
  }
  if (estB) {
    const l = lots.find(x => x.key === estB.dataset.est);
    const v = prompt(`Your resale estimate for:\n${l.title}\n\nDollars (leave blank to clear)`, l.manualEstimate ?? '');
    if (v === null) return;
    await fetch(`/api/lots/${encodeURIComponent(l.key)}/estimate`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ value: v.replace(/[$,\s]/g, '') }) });
    load();
  }
});
$('#list').addEventListener('click', e => {
  if (e.target.id !== 'showStat') return;
  e.preventDefault(); $('#hideStat').setAttribute('aria-pressed', 'false'); save('hideStat', false); render();
});
$('#watchList').addEventListener('click', async e => {
  const b = e.target.closest('[data-unwatch]'); if (!b) return;
  if (!confirm('Stop watching this lot?')) return;
  await fetch(`/api/lots/${encodeURIComponent(b.dataset.unwatch)}/star`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ starred: false }) });
  load();
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-research]'); if (!b) return;
  if (!aiOn) { openSettings(); return alert('Add your Claude API key in Settings first.'); }
  b.disabled = true; b.textContent = 'Searching…';
  const r = await fetch(`/api/lots/${encodeURIComponent(b.dataset.research)}/research`, { method: 'POST' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert(j.error || 'Research failed.');
  load();
});
$('#watchAdd').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('#watchUrl').value.trim(); if (!url) return;
  const r = await fetch('/api/watch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url }) });
  const j = await r.json();
  if (!r.ok) return alert(j.error || 'Could not add that link.');
  $('#watchUrl').value = '';
  load();
});
function openSettings() {
  fetch('/api/settings').then(r => r.json()).then(st => {
    $('#keyState').textContent = st.anthropicKeySet ? `· saved ${st.anthropicKeyMasked}${st.anthropicKeyFrom === '.env' ? ' (from .env)' : ''}` : '· not set';
    $('#sKey').value = ''; $('#keyResult').textContent = '';
    $('#sResearch').checked = st.researchEnabled; $('#sPerDay').value = st.researchPerDay; $('#sNtfy').value = st.ntfyUrl;
    $('#settings').showModal();
  });
}
$('#openSettings').addEventListener('click', e => { e.preventDefault(); openSettings(); });
$('#closeSettings').addEventListener('click', () => $('#settings').close());
async function saveSettings(extra = {}) {
  const body = { researchEnabled: $('#sResearch').checked, researchPerDay: Number($('#sPerDay').value), ntfyUrl: $('#sNtfy').value.trim(), ...extra };
  if ($('#sKey').value.trim()) body.anthropicKey = $('#sKey').value.trim();
  const r = await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { alert(j.error || 'Could not save.'); return false; }
  $('#keyState').textContent = j.anthropicKeySet ? `· saved ${j.anthropicKeyMasked}` : '· not set';
  $('#sKey').value = '';
  return true;
}
$('#saveSettings').addEventListener('click', async e => { e.preventDefault(); if (await saveSettings()) { $('#settings').close(); load(); } });
$('#testKey').addEventListener('click', async () => {
  if ($('#sKey').value.trim() && !(await saveSettings())) return;
  $('#keyResult').textContent = 'Testing…';
  const j = await (await fetch('/api/settings/test-key', { method: 'POST' })).json();
  $('#keyResult').textContent = j.ok ? '✓ Key works' : '✗ ' + (j.error || 'Key rejected');
});
$('#clearKey').addEventListener('click', async () => { if (confirm('Remove the saved Claude API key?')) { await saveSettings({ clearKey: true }); } });
$('#testAlert').addEventListener('click', async e => {
  e.preventDefault();
  const r = await (await fetch('/api/test-alert', { method: 'POST' })).json();
  alert(r.configured ? (r.ok ? 'Test alert sent — check your phone.' : 'Sending failed — check NTFY_URL.') : 'Alerts are not set up yet: add NTFY_URL to the .env file.');
});
load();
setInterval(load, 20000);
setInterval(tick, 1000);
</script>
</body>
</html>
