<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1824">
<title>KAMRADS Finds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1824'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%232fcb8c' stroke-width='2.5'/%3E%3Cline x1='19' y1='19' x2='25' y2='25' stroke='%232fcb8c' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1520; --panel: #101d2b; --raised: #162637; --hover: #1b2e42; --rule: #20334a; --rule-2: #2a4058;
  --ink: #e4ecf4; --muted: #8496ab; --dim: #5d7086;
  --gain: #2fcb8c; --gain-bg: rgba(47,203,140,.12); --loss: #ef5b67; --warn: #e5a93f; --warn-bg: rgba(229,169,63,.13);
  --info: #5fa4ee; --info-bg: rgba(95,164,238,.14);
  --fb: #6d9bf1; --gt: #8fd14f; --eb: #e5a93f;
  --side: 236px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-feature-settings: "tnum" 1; }
html { color-scheme: dark; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .gain { color: var(--gain); } .warn { color: var(--warn); } .loss { color: var(--loss); }

.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule); }
.topbar { display: grid; grid-template-columns: var(--side) 1fr auto; align-items: center; height: 54px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 18px; text-decoration: none; height: 100%; border-right: 1px solid var(--rule); }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .6px; }
.brand span { display: block; color: var(--gain); font-size: 11px; margin-top: -3px; font-weight: 600; }
.switch { display: flex; gap: 2px; padding: 0 18px; align-items: center; }
.switch a { text-decoration: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); }
.switch a:hover { background: var(--raised); color: var(--ink); }
.switch a.on { background: var(--raised); color: var(--ink); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 4px; padding: 0 14px; }
.tbtn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tbtn:hover { background: var(--raised); color: var(--ink); }
.who { color: var(--dim); font-size: 12.5px; padding-left: 10px; border-left: 1px solid var(--rule); margin-left: 4px; }
.menu-btn { display: none; }

.desk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.kpi { padding: 9px 18px 10px; border-right: 1px solid var(--rule); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .v { font-size: 19px; font-weight: 600; white-space: nowrap; }
.kpi .l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.frame { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - 110px); }
aside { border-right: 1px solid var(--rule); background: var(--panel); padding: 8px 0 30px; position: sticky; top: 110px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; }
.side-h { color: var(--dim); font-size: 12px; font-weight: 600; padding: 14px 18px 6px; display: flex; justify-content: space-between; align-items: center; }
.side-h button { background: none; border: 0; color: var(--info); cursor: pointer; font-size: 12px; padding: 0; }
.nav { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; border-left: 3px solid transparent; padding: 7px 15px; text-align: left; cursor: pointer; color: var(--muted); }
.nav:hover { background: var(--raised); color: var(--ink); }
.nav[aria-pressed="true"] { border-left-color: var(--gain); background: var(--raised); color: var(--ink); font-weight: 600; }
.nav .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .c { color: var(--dim); font-size: 12px; font-weight: 400; white-space: nowrap; }
.nav .c b { color: var(--gain); font-weight: 600; }
.site-row { display: flex; align-items: center; gap: 9px; padding: 5px 18px; color: var(--muted); }
.site-row .c { margin-left: auto; color: var(--dim); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ok { background: var(--gain); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--loss); }
.side-foot { padding: 16px 18px 0; color: var(--dim); font-size: 12px; line-height: 1.7; }
.side-foot a { color: var(--muted); }

main { padding: 16px 20px 60px; min-width: 0; }
.head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; }
.head .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.head .grow { flex: 1; min-width: 200px; }
.btn { background: var(--raised); border: 1px solid var(--rule-2); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--gain); border-color: var(--gain); color: #06261a; font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { background: none; border: 0; border-right: 1px solid var(--rule-2); padding: 5px 11px; cursor: pointer; color: var(--muted); white-space: nowrap; flex: none; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.seg .n { color: var(--dim); font-size: 11.5px; margin-left: 4px; }
select.sel { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 5px 8px; }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; }
h2.sec { font-size: 14px; font-weight: 600; margin: 22px 0 10px; display: flex; align-items: baseline; gap: 8px; }
h2.sec .muted { font-weight: 400; font-size: 12.5px; }

/* listing cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; position: relative; }
.card:hover { border-color: var(--rule-2); background: var(--hover); }
.card .ph { aspect-ratio: 4 / 3; background: var(--raised) center / cover no-repeat; position: relative; }
.card .ph.none::after { content: "no photo"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 12px; }
.card .new { position: absolute; top: 8px; left: 8px; background: var(--gain); color: #06261a; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; }
.card .src { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; background: rgba(6,14,22,.82); }
.src.facebook { color: var(--fb); } .src.gumtree { color: var(--gt); } .src.ebay { color: var(--eb); }
.card .bd { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card .pr { font-size: 16px; font-weight: 700; }
.card .ti { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
.card .mt { color: var(--muted); font-size: 12px; margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.card .mt .km { color: var(--ink); font-weight: 500; }

/* auction matches */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.lot { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--rule); text-decoration: none; }
.lot:last-child { border-bottom: 0; }
.lot:hover { background: var(--hover); }
.lot .ph { width: 64px; height: 48px; border-radius: 5px; background: var(--raised) center / cover no-repeat; }
.lot .ti { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lot .mt { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.lot .r { text-align: right; white-space: nowrap; }
.lot .r .b { font-weight: 700; }
.chip { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 5px; }
.empty { color: var(--muted); text-align: center; padding: 40px 20px; background: var(--panel); border: 1px dashed var(--rule-2); border-radius: 8px; }
.empty b { color: var(--ink); }

dialog.box { background: var(--panel); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 10px; padding: 18px 20px; width: min(620px, calc(100vw - 24px)); }
dialog.box::backdrop { background: rgba(3,8,14,.6); }
dialog.box h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
dialog.box p.lead { color: var(--muted); margin: 0 0 10px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.form label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.form .full { grid-column: 1 / -1; }
.form input[type=text], .form input[type=number] { background: var(--bg); border: 1px solid var(--rule-2); border-radius: 6px; padding: 7px 10px; width: 100%; }
.form .hint { color: var(--dim); font-size: 11.5px; }
.form .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; color: var(--ink); font-size: 13px; }
.form .row label { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
.form input[type=checkbox] { accent-color: var(--gain); }
.form input[type=range] { accent-color: var(--gain); width: 100%; }
.end { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
.end .grow { flex: 1; }
.err { color: var(--warn); font-size: 12.5px; }

@media (max-width: 900px) {
  :root { --side: 0px; }
  .topbar { grid-template-columns: auto 1fr auto; }
  .brand { border-right: 0; padding: 0 8px 0 12px; } .brand > div { display: none; }
  .menu-btn { display: inline-flex; } .who, .lbl { display: none; }
  .switch { padding: 0; } .switch a { padding: 6px 6px; font-size: 13px; }
  .desk { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:nth-child(n+3) { display: none; }
  .kpi { padding: 7px 12px; } .kpi .v { font-size: 16px; }
  .frame { grid-template-columns: 1fr; }
  aside { position: fixed; top: 0; left: 0; bottom: 0; width: 272px; height: 100vh; height: 100dvh; max-height: none; align-self: auto; overflow-y: auto; overscroll-behavior: contain; z-index: 40; transform: translateX(-100%); transition: transform .18s ease; }
  aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(3,8,14,.55); }
  main { padding: 12px 10px 60px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .card .pr { font-size: 14.5px; }
  .form { grid-template-columns: 1fr; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<div class="top">
  <div class="topbar">
    <a class="brand" href="/finds">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="13" fill="none" stroke="#2fcb8c" stroke-width="2.6" stroke-dasharray="62 20" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="7.5" fill="none" stroke="#2fcb8c" stroke-width="2.6" stroke-dasharray="34 13" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="2.6" fill="#2fcb8c"/><line x1="17" y1="17" x2="27" y2="7" stroke="#2fcb8c" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div><b>KAMRADS</b><span>Finds</span></div>
    </a>
    <div class="switch"><button class="tbtn menu-btn" id="menuBtn" aria-label="Menu">☰</button><a href="/">Auctions</a><a href="/freight">Freight</a><a href="/bought">Bought</a><a href="/finds" class="on">Finds</a><a href="/dreams">Dreams</a></div>
    <div class="top-actions"><span class="who" id="who"></span></div>
  </div>
  <div class="desk" id="desk"></div>
</div>

<div class="frame">
  <aside id="side">
    <div class="side-h">My searches <button id="addBtn">+ New</button></div>
    <div id="searches"></div>
    <div class="side-h">Sites</div>
    <div id="sources"></div>
    <div class="side-foot"><span id="every"></span><br><a href="#" id="scanNow">Search now</a><br><span id="updated"></span></div>
  </aside>

  <main>
    <div class="head">
      <div class="grow"><h1 id="title">Finds</h1><div class="sub" id="subtitle"></div></div>
      <button class="btn sm" id="alertBtn" hidden></button>
      <button class="btn sm" id="editBtn" hidden>Edit search</button>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="seg" id="srcSeg"></div>
      <select class="sel" id="sort" aria-label="Sort">
        <option value="new">Newest first</option><option value="near">Nearest first</option><option value="cheap">Cheapest first</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div id="results"></div>
    <div id="auctions"></div>
  </main>
</div>

<dialog id="editor" class="box">
  <h2 id="edTitle">New search</h2>
  <p class="lead">Like Swoopa: what to look for, where, and what to pay. New listings that match buzz your phone (once each).</p>
  <form class="form" id="edForm" autocomplete="off">
    <label class="full">Look for <input type="text" id="fTerms" placeholder="vending machine -toy, snack machine" required>
      <span class="hint">Commas for alternatives ("vending machine, snack machine"); a minus word leaves those out ("-toy").</span></label>
    <label>Near <input type="text" id="fPlace" placeholder="Fyshwick ACT (blank = anywhere)"></label>
    <label>Within <span id="fRadiusTxt" class="num" style="color:var(--ink)"></span><input type="range" id="fRadius" min="10" max="1000" step="10" value="150"></label>
    <label>Price from <input type="number" id="fMin" min="0" step="1" placeholder="$ any"></label>
    <label>up to <input type="number" id="fMax" min="0" step="1" placeholder="$ any"></label>
    <div class="full"><div class="row" id="fSources"></div></div>
    <label class="full">Facebook area (optional) <input type="text" id="fFb" placeholder="Paste a Marketplace link for your area">
      <span class="hint">Open Facebook Marketplace set to your area and radius, copy the link and paste it here. Blank: the nearest big city.</span></label>
    <label class="full">Name (optional) <input type="text" id="fName" placeholder="Vending machines ACT"></label>
    <div class="full row"><label><input type="checkbox" id="fAlerts" checked> Phone alerts for new listings</label></div>
  </form>
  <div class="end"><button class="btn" type="button" id="edDel">Delete</button><span class="grow err" id="edErr"></span><button class="btn" type="button" id="edCancel">Cancel</button><button class="btn primary" type="button" id="edSave">Save search</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? 'No price' : n === 0 ? 'Free' : '$' + Math.round(n).toLocaleString('en-AU');
const SAVED = window.__PREFS || {};
const pref = (k, d) => { if (('kf_finds' + k) in SAVED) return SAVED['kf_finds' + k] ?? d; try { return JSON.parse(localStorage.getItem('kf_finds' + k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('kf_finds' + k, JSON.stringify(v)); } catch {} SAVED['kf_finds' + k] = v; fetch('/api/prefs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: 'kf_finds' + k, value: v ?? null }) }).catch(() => {}); };
const SRC = { facebook: 'Facebook', gumtree: 'Gumtree', ebay: 'eBay' };
const SITE_NAMES = { pickles: 'Pickles', manheim: 'Manheim', allbids: 'ALLBIDS', lloyds: 'Lloyds', grays: 'Grays', slattery: 'Slattery', auctionbarn: 'Auction Barn' };
let searches = [], current = pref('Sel', null), data = null, status = { sources: [] }, srcFilter = pref('Src', ''), sortBy = pref('Sort', 'new'), skew = 0, editing = null;
$('#sort').value = sortBy;

const ago = t => { if (!t) return ''; const m = Math.max(0, Math.round((Date.now() + skew - t) / 60000)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const until = t => { if (!t) return 'close time not known'; const m = Math.round((t - Date.now() - skew) / 60000); return m <= 0 ? 'closing' : m < 60 ? `${m} min left` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m left` : `${Math.round(m / 1440)} d left`; };

function renderSide() {
  $('#searches').innerHTML = searches.length ? searches.map(s => `<button class="nav" data-sel="${s.id}" aria-pressed="${current === s.id}"><span class="t">${esc(s.name)}</span><span class="c num">${s.fresh ? `<b>${s.fresh} new</b> · ` : ''}${s.count}${s.auctions ? ` +${s.auctions}` : ''}</span></button>`).join('')
    : '<div class="site-row dim" style="font-size:12.5px">No searches yet.</div>';
  $('#sources').innerHTML = (status.sources || []).map(s => {
    const age = s.last_ok ? (Date.now() - s.last_ok) / 60000 : Infinity;
    const err = s.last_error_at && (!s.last_ok || s.last_error_at > s.last_ok);
    const cls = !s.on ? '' : err ? 'bad' : age < 60 ? 'ok' : 'warn';
    const tip = s.needsKeys ? 'Needs eBay keys: see the setup note' : !s.on ? 'Turned off' : err ? s.last_error : s.last_ok ? `Last read ${Math.round(age)} min ago` : 'Waiting for its first read';
    return `<div class="site-row" title="${esc(tip)}"><span class="dot ${cls}"></span>${esc(s.label)}<span class="c">${s.needsKeys ? 'needs keys' : s.last_count != null && !err ? s.last_count : err ? 'problem' : ''}</span></div>`;
  }).join('');
  $('#every').textContent = status.everyMin ? `Searched every ${status.everyMin} min` : '';
}

function renderDesk() {
  const all = searches.reduce((a, s) => a + s.count, 0), fresh = searches.reduce((a, s) => a + s.fresh, 0), auc = searches.reduce((a, s) => a + s.auctions, 0);
  const k = (v, l, cls = '') => `<div class="kpi"><div class="v num ${cls}">${v}</div><div class="l">${l}</div></div>`;
  $('#desk').innerHTML = k(all.toLocaleString('en-AU'), 'Listings matching your searches') + k(fresh, 'New in the last 24 h', 'gain') + k(auc, 'At auction right now', 'warn') + k(searches.length, 'Saved searches');
}

function render() {
  renderSide(); renderDesk();
  const s = data?.search;
  ['#editBtn', '#alertBtn'].forEach(b => { $(b).hidden = !s; });
  $('#toolbar').hidden = !s;
  if (!s) {
    $('#title').textContent = 'Finds'; $('#subtitle').textContent = '';
    $('#results').innerHTML = `<div class="empty"><b>Search Facebook Marketplace, Gumtree and eBay</b><br>Pick a search on the left, or <a href="#" data-new="1">make one</a>.</div>`;
    $('#auctions').innerHTML = ''; return;
  }
  $('#title').textContent = s.name;
  $('#subtitle').textContent = [s.terms, s.place ? `within ${s.radius} km of ${s.place}` : 'anywhere in Australia', s.minPrice != null || s.maxPrice != null ? `${s.minPrice != null ? money(s.minPrice) : '$0'}–${s.maxPrice != null ? money(s.maxPrice) : 'any'}` : '', s.sources.map(x => SRC[x]).join(', ')].filter(Boolean).join(' · ');
  $('#alertBtn').textContent = s.alerts ? '🔔 Alerts on' : '🔕 Alerts off';
  const items = data.items.filter(i => !srcFilter || i.site === srcFilter);
  const cnt = k => data.items.filter(i => !k || i.site === k).length;
  $('#srcSeg').innerHTML = [['', 'All'], ...s.sources.map(x => [x, SRC[x]])].map(([k, l]) => `<button data-src="${k}" aria-pressed="${srcFilter === k}">${l}<span class="n num">${cnt(k)}</span></button>`).join('');
  const sorters = { new: (a, b) => b.postedAt - a.postedAt, near: (a, b) => (a.km ?? 1e9) - (b.km ?? 1e9), cheap: (a, b) => (a.price ?? 1e12) - (b.price ?? 1e12) };
  items.sort(sorters[sortBy] || sorters.new);
  $('#count').textContent = `${items.length} listing${items.length === 1 ? '' : 's'}`;
  $('#results').innerHTML = items.length ? `<div class="cards">${items.map(i => `
    <a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
      <div class="ph ${i.photo ? '' : 'none'}" ${i.photo ? `style="background-image:url('${esc(i.photo)}')"` : ''}>${i.fresh ? '<span class="new">NEW</span>' : ''}<span class="src ${i.site}">${esc(i.siteName)}</span></div>
      <div class="bd"><div class="pr num">${money(i.price)}</div><div class="ti">${esc(i.title)}</div>
        <div class="mt">${i.location ? `<span>${esc(i.location)}</span>` : ''}${i.km != null ? `<span class="km">${i.km.toLocaleString('en-AU')} km</span>` : s.place ? '<span>distance unknown</span>' : ''}<span>${i.postedApprox ? 'seen ' : ''}${esc(ago(i.postedAt))}</span></div></div>
    </a>`).join('')}</div>`
    : `<div class="empty">${s.scanned ? 'Nothing listed right now that matches. New listings will appear here (and buzz your phone).' : '<b>Searching…</b><br>The first search takes a few minutes. This page refreshes on its own.'}</div>`;
  $('#auctions').innerHTML = `<h2 class="sec">At auction <span class="muted">${data.lots.length ? `${data.lots.length} lot${data.lots.length === 1 ? '' : 's'} matching on the auction sites KAMRADS reads, nearest first` : 'nothing matching on the auction sites right now'}</span></h2>` + (data.lots.length ? `<div class="panel">${data.lots.map(l => `
    <a class="lot" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
      <div class="ph" ${l.photo ? `style="background-image:url('${esc(l.photo)}')"` : ''}></div>
      <div style="min-width:0"><div class="ti">${esc(l.title)}</div><div class="mt"><span class="chip">${esc(SITE_NAMES[l.site] || l.site)}</span>${l.location ? `<span>${esc(l.location)}</span>` : ''}${l.km != null ? `<span>${l.km.toLocaleString('en-AU')} km</span>` : ''}${l.bidCount != null ? `<span>${l.bidCount} bid${l.bidCount === 1 ? '' : 's'}</span>` : ''}</div></div>
      <div class="r"><div class="b num">${money(l.price)}</div><div class="mt" style="justify-content:flex-end">${l.allIn != null && l.allIn !== l.price ? `${money(l.allIn)} all-in · ` : ''}${esc(until(l.endAt))}</div></div>
    </a>`).join('')}</div>` : '');
}

async function load() {
  try {
    const [a, st] = await Promise.all([fetch('/api/finds/searches').then(r => r.json()), fetch('/api/finds/status').then(r => r.json())]);
    searches = a.searches; status = st; skew = a.now - Date.now();
    if (current == null || !searches.some(s => s.id === current)) current = searches[0]?.id ?? null;
    data = current != null ? await fetch(`/api/finds/searches/${current}`).then(r => r.json()) : null;
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    render();
  } catch { $('#updated').textContent = 'Connection problem, retrying'; }
}

// ---- search editor ----
const radiusTxt = () => { $('#fRadiusTxt').textContent = $('#fPlace').value.trim() ? `${$('#fRadius').value} km` : '(set a place)'; };
function openEditor(s = null) {
  editing = s;
  $('#edTitle').textContent = s ? 'Edit search' : 'New search';
  $('#fTerms').value = s?.terms || ''; $('#fPlace').value = s?.place || ''; $('#fRadius').value = s?.radius || 150;
  $('#fMin').value = s?.minPrice ?? ''; $('#fMax').value = s?.maxPrice ?? ''; $('#fFb').value = s?.fbArea ? `https://www.facebook.com/marketplace/${s.fbArea}/` : '';
  $('#fName').value = s && s.name !== s.terms ? s.name : ''; $('#fAlerts').checked = s ? s.alerts : true;
  const on = s ? s.sources : Object.keys(SRC);
  $('#fSources').innerHTML = 'Search on: ' + Object.entries(SRC).map(([k, l]) => { const st = status.sources.find(x => x.site === k); return `<label><input type="checkbox" value="${k}" ${on.includes(k) ? 'checked' : ''}> ${l}${st?.needsKeys ? ' <span class="dim">(needs keys)</span>' : ''}</label>`; }).join('');
  $('#edDel').hidden = !s; $('#edErr').textContent = '';
  radiusTxt(); $('#editor').showModal(); $('#fTerms').focus();
}
$('#fRadius').addEventListener('input', radiusTxt); $('#fPlace').addEventListener('input', radiusTxt);
$('#edCancel').addEventListener('click', () => $('#editor').close());
$('#edSave').addEventListener('click', async () => {
  const body = { terms: $('#fTerms').value, place: $('#fPlace').value, radius: $('#fRadius').value, minPrice: $('#fMin').value, maxPrice: $('#fMax').value,
    fbLink: $('#fFb').value, name: $('#fName').value, alerts: $('#fAlerts').checked, sources: [...document.querySelectorAll('#fSources input:checked')].map(x => x.value) };
  $('#edErr').textContent = 'Saving…';
  const r = await fetch(editing ? `/api/finds/searches/${editing.id}` : '/api/finds/searches', { method: editing ? 'PATCH' : 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { $('#edErr').textContent = d.error || 'Could not save'; return; }
  if (!editing) { current = d.id; save('Sel', current); }
  $('#editor').close(); load();
});
$('#edDel').addEventListener('click', async () => {
  if (!editing || !confirm(`Delete "${editing.name}"?`)) return;
  await fetch(`/api/finds/searches/${editing.id}`, { method: 'DELETE' });
  current = null; $('#editor').close(); load();
});

document.addEventListener('click', async e => {
  const t = e.target;
  const sel = t.closest('[data-sel]'); if (sel) { current = Number(sel.dataset.sel); save('Sel', current); $('#side').classList.remove('open'); data = await fetch(`/api/finds/searches/${current}`).then(r => r.json()); return render(); }
  const src = t.closest('[data-src]'); if (src) { srcFilter = src.dataset.src; save('Src', srcFilter); return render(); }
  if (t.closest('[data-new]') || t.id === 'addBtn') { e.preventDefault(); $('#side').classList.remove('open'); return openEditor(); }
});
$('#editBtn').addEventListener('click', () => openEditor(data?.search));
$('#alertBtn').addEventListener('click', async () => { const s = data.search; await fetch(`/api/finds/searches/${s.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ alerts: !s.alerts }) }); load(); });
$('#sort').addEventListener('change', e => { sortBy = e.target.value; save('Sort', sortBy); render(); });
$('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
$('#scanNow').addEventListener('click', async e => { e.preventDefault(); await fetch('/api/finds/scan', { method: 'POST' }); $('#updated').textContent = 'Searching… results in a few minutes'; });
fetch('/api/me').then(r => r.json()).then(x => { $('#who').textContent = x.user; }).catch(() => {});
load();
setInterval(() => { if (!$('#editor').open) load(); }, 60000);
</script>
</body>
</html>
