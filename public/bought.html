<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1824">
<title>KAMRADS Bought</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1824'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e5a93f' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e5a93f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1520; --panel: #101d2b; --raised: #162637; --hover: #1b2e42; --rule: #20334a; --rule-2: #2a4058;
  --ink: #e4ecf4; --muted: #8496ab; --dim: #5d7086;
  --gain: #2fcb8c; --gain-bg: rgba(47,203,140,.12); --loss: #ef5b67; --loss-bg: rgba(239,91,103,.12);
  --warn: #e5a93f; --warn-bg: rgba(229,169,63,.13); --info: #5fa4ee;
  --side: 236px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-feature-settings: "tnum" 1; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .gain { color: var(--gain); } .loss { color: var(--loss); } .warn { color: var(--warn); }

.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule); }
.topbar { display: grid; grid-template-columns: var(--side) 1fr auto; align-items: center; height: 54px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 18px; text-decoration: none; height: 100%; border-right: 1px solid var(--rule); }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .6px; }
.brand span { display: block; color: var(--warn); font-size: 11px; margin-top: -3px; font-weight: 600; }
.switch { display: flex; gap: 2px; padding: 0 18px; align-items: center; }
.switch a { text-decoration: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); }
.switch a:hover { background: var(--raised); color: var(--ink); }
.switch a.on { background: var(--raised); color: var(--ink); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.who { color: var(--dim); font-size: 12.5px; padding-left: 10px; border-left: 1px solid var(--rule); }
.menu-btn { display: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }

.desk { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.kpi { padding: 9px 18px 10px; border-right: 1px solid var(--rule); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .v { font-size: 19px; font-weight: 600; white-space: nowrap; }
.kpi .l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.frame { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - 110px); }
aside { border-right: 1px solid var(--rule); background: var(--panel); padding: 8px 0 30px; position: sticky; top: 110px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; }
.side-h { color: var(--dim); font-size: 12px; font-weight: 600; padding: 14px 18px 6px; }
.nav { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; border-left: 3px solid transparent; padding: 6px 15px; text-align: left; cursor: pointer; color: var(--muted); }
.nav:hover { background: var(--raised); color: var(--ink); }
.nav[aria-pressed="true"] { border-left-color: var(--warn); background: var(--raised); color: var(--ink); font-weight: 600; }
.nav .c { color: var(--dim); font-size: 12px; font-weight: 400; }
.side-foot { padding: 16px 18px 0; color: var(--dim); font-size: 12px; line-height: 1.7; }
.side-foot a { color: var(--muted); }

main { padding: 16px 20px 60px; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar h1 { margin: 0 6px 0 0; font-size: 18px; font-weight: 600; }
.toolbar input { background: var(--panel); border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 10px; min-width: 200px; }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.btn { background: var(--raised); border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--warn); border-color: var(--warn); color: #241600; font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.danger { color: var(--loss); }

.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
table.grid { width: 100%; border-collapse: collapse; }
.grid th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.grid th.r, .grid td.r { text-align: right; }
.grid td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.grid tr.row { cursor: pointer; }
.grid tr.row:hover td { background: var(--hover); }
.grid tr.row.open td { background: var(--raised); border-bottom-color: transparent; }
.grid tr.sold td { opacity: .78; }
.it-t { font-weight: 600; }
.it-m { color: var(--muted); font-size: 12px; display: flex; gap: 3px 10px; flex-wrap: wrap; margin-top: 2px; }
.site { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 5px; }
.money { font-weight: 600; white-space: nowrap; }
.sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.st { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 1px 7px; white-space: nowrap; background: var(--raised); color: var(--muted); }
.st.for-sale { background: var(--warn-bg); color: var(--warn); } .st.sold { background: var(--gain-bg); color: var(--gain); }
.st.repairing, .st.in-transit { background: rgba(95,164,238,.14); color: var(--info); }

tr.detail td { background: var(--raised); padding: 6px 16px 16px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 18px 26px; }
.dgrid h4 { margin: 8px 0 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.costs { width: 100%; border-collapse: collapse; }
.costs td { padding: 5px 6px; border-bottom: 1px solid var(--rule); }
.costs tr.tot td { border-bottom: 0; font-weight: 700; padding-top: 8px; }
.costs .x { background: none; border: 0; color: var(--dim); cursor: pointer; }
.costs .x:hover { color: var(--loss); }
.addcost { display: grid; grid-template-columns: 110px 150px 1fr 110px auto; gap: 6px; margin-top: 8px; }
.addcost input, .addcost select, .fields input, .fields select, .fields textarea { background: var(--bg); border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.fields label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
.fields .full { grid-column: 1 / -1; }
.result { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result div span { display: block; color: var(--muted); font-size: 12px; }
.result div b { font-size: 17px; }
.dacts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.empty { color: var(--muted); text-align: center; padding: 46px 20px; }
.empty b { color: var(--ink); }
dialog.box { background: var(--panel); color: var(--ink); border: 1px solid var(--rule-2); border-radius: 10px; padding: 18px 20px; width: min(560px, calc(100vw - 24px)); }
dialog.box::backdrop { background: rgba(3,8,14,.6); }
dialog.box h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
dialog.box p { color: var(--muted); margin: 0 0 10px; }
.end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

@media (max-width: 1050px) { .col-guide, .col-days { display: none; } .dgrid { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  :root { --side: 0px; }
  .topbar { grid-template-columns: auto 1fr auto; } .brand { border-right: 0; } .brand > div span { display: none; }
  .menu-btn { display: inline-flex; } .who, .lbl { display: none; } .brand { padding: 0 8px 0 12px; } .brand > div { display: none; }
  .switch { padding: 0; gap: 0; } .switch a { padding: 6px 7px; font-size: 13px; } .top-actions { padding: 0 10px 0 4px; }
  .desk { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi:nth-child(n+4) { display: none; } .kpi { padding: 7px 12px; } .kpi .v { font-size: 16px; }
  .frame { grid-template-columns: 1fr; }
  aside { position: fixed; top: 0; left: 0; bottom: 0; width: 272px; height: 100vh; height: 100dvh; max-height: none; align-self: auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; z-index: 40; transform: translateX(-100%); transition: transform .18s ease; }
  aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(3,8,14,.55); }
  main { padding: 12px 10px 60px; }
  .grid thead { display: none; } .grid, .grid tbody { display: block; }
  .grid tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "item cost" "status result"; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .grid tr.row td { padding: 0; border: 0; background: none !important; }
  .grid td.c-item { grid-area: item; } .grid td.c-cost { grid-area: cost; } .grid td.c-status { grid-area: status; } .grid td.c-result { grid-area: result; text-align: right; }
  .grid td.c-sale, .grid td.col-guide, .grid td.col-days { display: none; }
  tr.detail { display: block; } tr.detail td { display: block; }
  .addcost { grid-template-columns: 1fr 1fr; } .addcost input:nth-child(3) { grid-column: 1 / -1; }
  .fields { grid-template-columns: 1fr; } .result { grid-template-columns: 1fr 1fr; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* thin dark scrollbars that match the desk (the sidebar only shows its bar while you're over it) */
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
aside { scrollbar-color: transparent transparent; }
aside:hover { scrollbar-color: var(--rule-2) transparent; }
@media (hover: none) { aside { scrollbar-color: var(--rule-2) transparent; } }
aside::-webkit-scrollbar-thumb { background: transparent; }
aside:hover::-webkit-scrollbar-thumb { background: var(--rule-2); background-clip: padding-box; }
html { color-scheme: dark; }
</style>
</head>
<body>
<div class="top">
  <div class="topbar">
    <a class="brand" href="/bought">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="13" fill="none" stroke="#e5a93f" stroke-width="2.6" stroke-dasharray="62 20" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="7.5" fill="none" stroke="#e5a93f" stroke-width="2.6" stroke-dasharray="34 13" transform="rotate(-50 17 17)"/>
        <circle cx="17" cy="17" r="2.6" fill="#e5a93f"/><line x1="17" y1="17" x2="27" y2="7" stroke="#e5a93f" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div><b>KAMRADS</b><span>Bought &amp; costs</span></div>
    </a>
    <div class="switch"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><a href="/">Auctions</a><a href="/freight">Freight</a><a href="/bought" class="on">Bought</a><a href="/finds">Finds</a></div>
    <div class="top-actions"><button class="btn primary" id="addBtn">+<span class="lbl"> Add item</span></button><span class="who" id="who"></span></div>
  </div>
  <div class="desk" id="desk"></div>
</div>

<div class="frame">
  <aside id="side">
    <div class="side-h">Status</div><div id="statuses"></div>
    <div class="side-h">Bought by company</div><div id="entities"></div>
    <div class="side-foot"><a href="/api/export/bought.csv">Download all (CSV)</a><br><span id="updated"></span></div>
  </aside>
  <main>
    <div class="toolbar"><h1 id="title">Everything we hold</h1><input type="search" id="q" placeholder="Search: hilux, washer…"><span class="count" id="count"></span></div>
    <div class="panel"><div id="list"></div></div>
  </main>
</div>

<dialog id="addBox" class="box">
  <form method="dialog" id="addForm">
    <h2>Add an item</h2>
    <p>For anything bought outside KAMRADS. Won lots can be added straight from the auction board with <b>Won it</b>.</p>
    <div class="fields">
      <label class="full">What is it <input id="nTitle" required placeholder="2016 Toyota HiAce LWB"></label>
      <label>What we paid <input id="nPrice" inputmode="decimal" placeholder="$"></label>
      <label>Bought on <input id="nDate" type="date"></label>
      <label>Bought by (company) <input id="nEntity" list="entityList" placeholder="e.g. Katara Group"></label>
      <label>Where it is <input id="nLoc" placeholder="Fyshwick ACT"></label>
      <label class="full">Link (optional) <input id="nUrl" type="url" placeholder="https://"></label>
    </div>
    <div class="end"><button type="button" class="btn" id="addCancel">Cancel</button><button class="btn primary">Add</button></div>
  </form>
</dialog>
<datalist id="entityList"></datalist>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-AU');
const pct = n => n == null ? '' : `${n >= 0 ? '+' : ''}${Math.round(n * 100)}%`;
const day = t => t ? new Date(t).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: '2-digit' }) : '';
const isoDay = t => t ? new Date(t - new Date(t).getTimezoneOffset() * 60000).toISOString().slice(0, 10) : '';
const fromIso = v => v ? new Date(v + 'T12:00:00').getTime() : '';
const SITE_NAMES = { pickles: 'Pickles', manheim: 'Manheim', allbids: 'ALLBIDS', lloyds: 'Lloyds', grays: 'Grays', slattery: 'Slattery', auctionbarn: 'Auction Barn' };
const ST_LABEL = { bought: 'Bought', 'in transit': 'In transit', repairing: 'Repairing', 'for sale': 'For sale', sold: 'Sold', keeping: 'Keeping' };
const post = (u, b, m = 'POST') => fetch(u, { method: m, headers: { 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; });

let data = { purchases: [], categories: [], statuses: [], entities: [], summary: {} }, status = 'held', entity = '', openId = Number(location.hash.slice(1)) || null;

function visible() {
  const q = $('#q').value.trim().toLowerCase();
  return data.purchases.filter(p => {
    if (status === 'held' && p.status === 'sold') return false;
    if (status !== 'held' && status !== 'all' && p.status !== status) return false;
    if (entity && (p.entity || '') !== entity) return false;
    if (q && !`${p.title} ${p.entity} ${p.location} ${p.notes}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const s = data.summary;
  const k = (v, l, cls = '') => `<div class="kpi"><div class="v num ${cls}">${v}</div><div class="l">${l}</div></div>`;
  $('#desk').innerHTML = k(s.held ?? 0, 'Items we hold') + k(money(s.tiedUp), 'Money tied up in them', 'warn')
    + k(money(s.profit), `Profit on ${s.sold || 0} sold`, s.profit >= 0 ? 'gain' : 'loss') + k(s.avgMargin == null ? '—' : pct(s.avgMargin), 'Average margin', s.avgMargin >= 0 ? 'gain' : 'loss')
    + k(s.avgDays == null ? '—' : `${s.avgDays} days`, 'Average time to sell');
  const counts = { held: data.purchases.filter(p => p.status !== 'sold').length, all: data.purchases.length };
  for (const st of data.statuses) counts[st] = data.purchases.filter(p => p.status === st).length;
  $('#statuses').innerHTML = [['held', 'Everything we hold'], ...data.statuses.map(x => [x, ST_LABEL[x] || x]), ['all', 'All, including sold']]
    .map(([key, l]) => `<button class="nav" data-status="${esc(key)}" aria-pressed="${status === key}">${esc(l)}<span class="c num">${counts[key] || ''}</span></button>`).join('');
  $('#entities').innerHTML = `<button class="nav" data-entity="" aria-pressed="${!entity}">All companies</button>` + data.entities.map(e => `<button class="nav" data-entity="${esc(e)}" aria-pressed="${entity === e}">${esc(e)}<span class="c num">${data.purchases.filter(p => p.entity === e && p.status !== 'sold').length || ''}</span></button>`).join('');
  $('#entityList').innerHTML = data.entities.map(e => `<option value="${esc(e)}">`).join('');
  $('#title').textContent = status === 'held' ? 'Everything we hold' : status === 'all' ? 'All items' : ST_LABEL[status];
  const rows = visible();
  $('#count').textContent = `${rows.length} item${rows.length === 1 ? '' : 's'} · ${money(rows.filter(p => p.status !== 'sold').reduce((a, p) => a + p.total, 0))} tied up`;
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty">${data.purchases.length ? 'Nothing here.' : '<b>Nothing bought yet.</b><br>On the auction board, press <b>Won it</b> on a lot you won, or add an item with <b>+ Add item</b>. Then log every cost against it as you go.'}</div>`;
    return;
  }
  $('#list').innerHTML = `<table class="grid"><thead><tr><th>Item</th><th>Status</th><th class="r">It owes us</th><th class="r col-guide">Value guide</th><th class="r">Asking / sold</th><th class="r">Profit</th><th class="r col-days">Days</th></tr></thead><tbody>${rows.map(p => `
    <tr class="row ${p.status === 'sold' ? 'sold' : ''} ${openId === p.id ? 'open' : ''}" data-id="${p.id}">
      <td class="c-item"><div class="it-t">${esc(p.title)}</div><div class="it-m">${p.site ? `<span class="site">${esc(SITE_NAMES[p.site] || p.site)}</span>` : ''}${p.entity ? `<span>${esc(p.entity)}</span>` : ''}<span>bought ${esc(day(p.boughtAt))}</span>${p.location ? `<span>${esc(p.location)}</span>` : ''}${p.odometer ? `<span class="num">${p.odometer.toLocaleString('en-AU')} km</span>` : ''}</div></td>
      <td class="c-status"><span class="st ${esc(p.status.replace(' ', '-'))}">${esc(ST_LABEL[p.status] || p.status)}</span></td>
      <td class="c-cost r"><div class="money num">${money(p.total)}</div><div class="sub">${p.costs.length} cost${p.costs.length === 1 ? '' : 's'}</div></td>
      <td class="col-guide r">${p.valueGuide ? `<div class="num">${money(p.valueGuide)}</div><div class="sub">${esc(p.valueSource)}</div>` : '<span class="dim">—</span>'}</td>
      <td class="c-sale r">${p.status === 'sold' ? `<div class="money num">${money(p.soldPrice)}</div><div class="sub">sold ${esc(day(p.soldAt))}</div>` : p.askingPrice ? `<div class="num">${money(p.askingPrice)}</div><div class="sub">asking</div>` : '<span class="dim">—</span>'}</td>
      <td class="c-result r">${p.profit != null ? `<div class="money num ${p.profit >= 0 ? 'gain' : 'loss'}">${money(p.profit)}</div><div class="sub">${pct(p.margin)}</div>` : p.projected != null ? `<div class="num ${p.projected >= 0 ? 'gain' : 'loss'}">${money(p.projected)}</div><div class="sub">at asking</div>` : '<span class="dim">—</span>'}</td>
      <td class="col-days r num">${p.days ?? ''}</td>
    </tr>${openId === p.id ? detailHtml(p) : ''}`).join('')}</tbody></table>`;
}

function detailHtml(p) {
  const cats = data.categories.map(c => `<option>${esc(c)}</option>`).join('');
  return `<tr class="detail"><td colspan="7"><div class="dgrid">
    <div>
      <h4>Every cost so far</h4>
      <table class="costs">${p.costs.map(c => `<tr><td class="dim num" style="white-space:nowrap">${esc(new Date(c.at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }))}</td><td>${esc(c.category)}</td><td class="muted">${esc(c.description || '')}${c.by ? ` <span class="dim">· ${esc(c.by)}</span>` : ''}</td><td class="r num">${money(c.amount)}</td><td class="r"><button class="x" data-delcost="${c.id}" title="Remove this cost">✕</button></td></tr>`).join('')}
        <tr class="tot"><td></td><td>It owes us</td><td></td><td class="r num">${money(p.total)}</td><td></td></tr></table>
      <form class="addcost" data-addcost="${p.id}">
        <input type="date" name="at" value="${isoDay(Date.now())}" aria-label="Date">
        <select name="category" aria-label="Type">${data.categories.map(c => `<option ${c === 'Repairs & parts' ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <input name="description" placeholder="What for, e.g. tyres, tow from yard" aria-label="Description">
        <input name="amount" inputmode="decimal" placeholder="$ amount" aria-label="Amount" required>
        <button class="btn primary sm">Add cost</button>
      </form>
    </div>
    <div>
      <h4>Selling it</h4>
      ${p.status === 'sold' ? `<div class="result"><div><span>Sold for</span><b class="num">${money(p.soldPrice)}</b></div><div><span>Profit</span><b class="num ${p.profit >= 0 ? 'gain' : 'loss'}">${money(p.profit)}</b></div><div><span>Margin · days</span><b class="num">${pct(p.margin)} · ${p.days ?? '—'}</b></div></div>`
        : `<div class="result"><div><span>Break-even</span><b class="num">${money(p.total)}</b></div><div><span>+20% margin</span><b class="num">${money(p.total * 1.2)}</b></div><div><span>Value guide</span><b class="num">${money(p.valueGuide)}</b></div></div>`}
      <div class="fields" data-fields="${p.id}">
        <label>Status <select name="status">${data.statuses.map(s => `<option value="${esc(s)}" ${s === p.status ? 'selected' : ''}>${esc(ST_LABEL[s] || s)}</option>`).join('')}</select></label>
        <label>Bought by (company) <input name="entity" list="entityList" value="${esc(p.entity || '')}"></label>
        <label>Asking price <input name="asking_price" inputmode="decimal" value="${p.askingPrice ?? ''}" placeholder="$"></label>
        <label>Sold for <input name="sold_price" inputmode="decimal" value="${p.soldPrice ?? ''}" placeholder="$"></label>
        <label>Sold on <input name="sold_at" type="date" value="${isoDay(p.soldAt)}"></label>
        <label>Sold to <input name="sold_to" value="${esc(p.soldTo || '')}"></label>
        <label>Where it is <input name="location" value="${esc(p.location || '')}"></label>
        <label>Odometer (km) <input name="odometer" inputmode="numeric" value="${p.odometer ?? ''}"></label>
        <label class="full">Notes <textarea name="notes" rows="2">${esc(p.notes || '')}</textarea></label>
      </div>
      <div class="dacts"><button class="btn primary sm" data-save="${p.id}">Save</button>${p.url ? `<a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Original listing</a>` : ''}<span style="flex:1"></span><button class="btn sm danger" data-del="${p.id}">Delete item</button></div>
    </div></div></td></tr>`;
}

async function load() {
  try { data = await (await fetch('/api/purchases')).json(); render(); $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); }
  catch { $('#updated').textContent = 'Connection problem, retrying'; }
}

document.addEventListener('click', async e => {
  const t = e.target;
  const s = t.closest('[data-status]'); if (s) { status = s.dataset.status; $('#side').classList.remove('open'); return render(); }
  const en = t.closest('[data-entity]'); if (en) { entity = en.dataset.entity; $('#side').classList.remove('open'); return render(); }
  const dc = t.closest('[data-delcost]'); if (dc) { if (!confirm('Remove this cost?')) return; await post(`/api/purchases/${openId}/costs/${dc.dataset.delcost}`, null, 'DELETE'); return load(); }
  const sv = t.closest('[data-save]');
  if (sv) {
    const box = document.querySelector(`[data-fields="${sv.dataset.save}"]`), body = {};
    for (const el of box.querySelectorAll('[name]')) body[el.name] = el.type === 'date' ? fromIso(el.value) : el.value;
    try { await post(`/api/purchases/${sv.dataset.save}`, body, 'PATCH'); sv.textContent = 'Saved'; load(); } catch (err) { alert(err.message); }
    return;
  }
  const del = t.closest('[data-del]'); if (del) { if (!confirm('Delete this item and all its costs? This can\'t be undone.')) return; await post(`/api/purchases/${del.dataset.del}`, null, 'DELETE'); openId = null; return load(); }
  const row = t.closest('tr.row');
  if (row && !t.closest('button, a, input, select, textarea')) { openId = openId === Number(row.dataset.id) ? null : Number(row.dataset.id); history.replaceState(null, '', openId ? `#${openId}` : location.pathname); render(); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-addcost]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  try { await post(`/api/purchases/${f.dataset.addcost}/costs`, { ...d, at: fromIso(d.at) }); load(); } catch (err) { alert(err.message); }
});
$('#q').addEventListener('input', render);
$('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
$('#addBtn').addEventListener('click', () => { $('#nDate').value = isoDay(Date.now()); $('#addBox').showModal(); });
$('#addCancel').addEventListener('click', () => $('#addBox').close());
$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await post('/api/purchases', { title: $('#nTitle').value, price: $('#nPrice').value, bought_at: fromIso($('#nDate').value), entity: $('#nEntity').value, location: $('#nLoc').value, url: $('#nUrl').value });
    $('#addBox').close(); $('#addForm').reset(); openId = r.id; status = 'held'; load();
  } catch (err) { alert(err.message); }
});
fetch('/api/me').then(r => r.json()).then(x => { $('#who').textContent = x.user; }).catch(() => {});
load();
</script>
</body>
</html>
